<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Details - LearnFlow</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="font-sans antialiased text-slate-300 bg-slate-950 min-h-screen selection:bg-indigo-500/30">
    
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 w-full backdrop-blur-md bg-slate-950/80 border-b border-white/10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-4">
            <a href="/dashboard.html" class="text-slate-400 hover:text-white transition-colors">
              <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div class="h-6 w-px bg-slate-800"></div>
            <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">LearnFlow</span>
          </div>
          <div class="flex items-center gap-4">
             <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-500 p-[2px]">
              <img class="h-full w-full rounded-full border border-slate-900 object-cover" src="https://i.pravatar.cc/150?img=11" alt="User Avatar">
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative">
       <!-- Glow Elements -->
       <div class="absolute top-[10%] right-[10%] w-[30%] h-[50%] rounded-full bg-indigo-600/10 blur-[130px] pointer-events-none"></div>

      <!-- Course Header -->
      <div class="bg-slate-900/60 rounded-3xl p-8 border border-slate-800 backdrop-blur-md mb-8 shadow-xl relative overflow-hidden">
        <div class="absolute -right-20 -top-20 w-64 h-64 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>
        
        <div class="flex flex-col md:flex-row gap-8 items-start md:items-center relative z-10">
          <div id="course-initials" class="h-32 w-32 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-500 flex flex-shrink-0 items-center justify-center text-4xl font-bold text-white shadow-lg">
            ??
          </div>
          <div class="flex-1 space-y-4">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span id="course-category" class="px-3 py-1 text-xs font-semibold bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/20">Category</span>
                <span class="text-sm text-slate-400 flex items-center gap-1">
                  <svg class="h-4 w-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  <span id="course-duration">--</span>
                </span>
              </div>
              <h1 id="course-title" class="text-3xl font-extrabold text-white">Loading Course...</h1>
            </div>
            <p id="course-description" class="text-slate-400 max-w-2xl leading-relaxed">
              Loading description...
            </p>
            
            <div class="flex items-center gap-4">
              <div id="progress-container" class="w-64 hidden">
                <div class="flex justify-between text-sm text-slate-400 mb-2">
                  <span class="font-medium text-white">Course Progress</span>
                  <span id="course-progress-text">0%</span>
                </div>
                <div class="w-full bg-slate-950 rounded-full h-2 border border-slate-800">
                  <div id="course-progress-bar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-2 rounded-full relative" style="width: 0%"></div>
                </div>
              </div>
              <button id="enroll-resume-btn" class="ml-auto px-6 py-2.5 bg-white text-slate-950 font-semibold rounded-lg shadow-lg hover:bg-slate-200 transition-colors">
                Loading...
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Modules List -->
      <div id="module-list-container" class="space-y-4">
        <h2 class="text-2xl font-bold text-white mb-6">Course Modules</h2>
        <!-- Modules will be injected here -->
      </div>
    </main>

    <script type="module" src="/src/course.js"></script>
  </body>
</html>
