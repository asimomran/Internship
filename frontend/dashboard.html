<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - LearnFlow</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="font-sans antialiased text-slate-300 bg-slate-950 flex h-screen overflow-hidden selection:bg-indigo-500/30">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900/80 backdrop-blur-xl border-r border-slate-800 flex flex-col transition-all duration-300 hidden md:flex">
      <div class="h-16 flex items-center px-6 border-b border-slate-800">
        <div class="flex items-center gap-2">
            <svg class="h-6 w-6 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">LearnFlow</span>
        </div>
      </div>
      
      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="/dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-500/10 text-indigo-400 font-medium border border-indigo-500/20">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
          Dashboard
        </a>
        <a href="/catalog.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition-colors">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          Catalog
        </a>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <a href="/index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-red-400/10 transition-colors">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
          Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
      <!-- Glow Elements -->
      <div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-cyan-600/10 blur-[130px] pointer-events-none"></div>

      <!-- Topbar -->
      <header class="h-16 flex items-center justify-between px-6 border-b border-white/5 bg-slate-900/50 backdrop-blur-md z-10">
        <!-- Mobile Menu Button -->
        <button class="md:hidden text-slate-400 hover:text-white">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <h1 class="text-xl font-semibold text-white">Dashboard</h1>

        <div class="flex items-center gap-4">
          <button class="text-slate-400 hover:text-white transition-colors">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          </button>
          <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-500 p-[2px]">
            <img class="h-full w-full rounded-full border border-slate-900 object-cover" src="https://i.pravatar.cc/150?img=11" alt="User Avatar">
          </div>
        </div>
      </header>

      <!-- Scrollable Content Area -->
      <div class="flex-1 overflow-y-auto p-6 z-10">
        <div class="max-w-6xl mx-auto space-y-8">
          
          <!-- Welcome Section -->
          <div>
            <h2 id="welcome-message" class="text-2xl font-bold text-white mb-1">Welcome back! 👋</h2>
            <p class="text-slate-400">Here's what's happening with your learning progress today.</p>
          </div>

          <!-- Quick Stats Cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm relative overflow-hidden group hover:border-indigo-500/50 transition-colors">
              <div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-500/10 rounded-full blur-xl group-hover:bg-indigo-500/20 transition-all"></div>
              <div class="flex items-center gap-4">
                <div class="p-3 bg-indigo-500/20 rounded-xl text-indigo-400">
                  <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                  <div class="text-sm text-slate-400 mb-1">Courses in Progress</div>
                  <div id="count-enrolled" class="text-2xl font-bold text-white">0</div>
                </div>
              </div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm relative overflow-hidden group hover:border-cyan-500/50 transition-colors">
              <div class="absolute -right-4 -top-4 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl group-hover:bg-cyan-500/20 transition-all"></div>
              <div class="flex items-center gap-4">
                <div class="p-3 bg-cyan-500/20 rounded-xl text-cyan-400">
                  <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                  <div class="text-sm text-slate-400 mb-1">Completed Modules</div>
                  <div id="count-completed" class="text-2xl font-bold text-white">0</div>
                </div>
              </div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-sm relative overflow-hidden group hover:border-teal-500/50 transition-colors">
              <div class="absolute -right-4 -top-4 w-24 h-24 bg-teal-500/10 rounded-full blur-xl group-hover:bg-teal-500/20 transition-all"></div>
              <div class="flex items-center gap-4">
                <div class="p-3 bg-teal-500/20 rounded-xl text-teal-400">
                  <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                  <div class="text-sm text-slate-400 mb-1">Hours Spent Learning</div>
                  <div id="count-hours" class="text-2xl font-bold text-white">0 <span class="text-xs text-slate-500 font-normal">hrs</span></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Charts Section -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Time Spent Chart -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-md">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-white">Daily Learning Activity</h3>
              </div>
              <div class="h-64 relative">
                <canvas id="activityChart"></canvas>
              </div>
            </div>

            <!-- Skills Distribution Chart -->
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-lg backdrop-blur-md">
              <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold text-white">Skills Distribution</h3>
              </div>
              <div class="h-64 relative">
                <canvas id="skillsChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Bottom Section: Course Progress -->
          <div class="bg-slate-900/60 border border-slate-800 rounded-2xl shadow-lg backdrop-blur-md flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
              <h3 class="text-lg font-semibold text-white">In Progress</h3>
              <a href="/catalog.html" class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors">Browse Catalog →</a>
            </div>
            <div id="enrolled-courses-list" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Data will be injected here -->
            </div>
          </div>

          <!-- Completed Courses Section -->
          <div id="completed-section" class="bg-slate-900/60 border border-slate-800 rounded-2xl shadow-lg backdrop-blur-md flex flex-col hidden">
            <div class="p-6 border-b border-white/5">
              <h3 class="text-lg font-semibold text-emerald-400">Completed Courses</h3>
            </div>
            <div id="completed-courses-list" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Data will be injected here -->
            </div>
          </div>

        </div>
      </div>
    </main>

    <!-- Import logic for Charts -->
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
